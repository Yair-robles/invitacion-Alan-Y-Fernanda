<!doctype html>
<html lang="es">
<head>

<title>Estamos preparando algo especial para ti</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:#faf5ec;color:#594536;font-family:Arial,sans-serif;text-align:center}
main{width:100%;max-width:560px;padding:56px 24px;border:1px solid #d8c6b3;border-radius:24px;background:#fffaf4}
.decoration{font-size:32px;color:#a78a68;margin-bottom:24px}
h1{margin:0;font-size:clamp(26px,6vw,38px);font-weight:500;line-height:1.3}
p{margin:20px 0 0;font-size:17px;line-height:1.6;color:#796653}
</style>
</head>
<body><main><div class="decoration" aria-hidden="true">✧</div><h1>Estamos preparando algo especial para ti.</h1><p>Muy pronto podrás ver la invitación.</p></main></body>
</html>
